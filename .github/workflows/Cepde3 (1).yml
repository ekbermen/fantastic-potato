          }

          static void runLoop() {
              g_t0 = std::chrono::steady_clock::now();
              u64 start = g_cpu.insts;
              cplog("[Cepde3] Çalışma başladı, PC=0x%llX", (ull)g_cpu.pc);
              while (g_run && !g_cpu.halted) {
                  for (int k = 0; k < 50000 && !g_cpu.halted; k++) step(g_cpu, g_mem);
              }
              double dt = std::chrono::duration<double>(std::chrono::steady_clock::now() - g_t0).count();
              u64 n = g_cpu.insts - start;
              g_mipsLast = dt > 0 ? n / dt / 1e6 : 0;
              if (g_mem.fault) cplog("[MEM] Geçersiz adres 0x%llX (PC=0x%llX)", (ull)g_mem.faultAddr, (ull)g_cpu.pc);
              if (g_cpu.halted) cplog("[Cepde3] Bitti: %llu komut, %.3f sn, %.2f MIPS", (ull)n, dt, g_mipsLast);
              else cplog("[Cepde3] Durduruldu: %llu komut", (ull)n);
              g_run = false;
          }

          static void stopRun() { g_run = false; if (g_th.joinable()) g_th.join(); }
          static void startRun() {
              if (!g_loaded || g_run) return;
              if (g_th.joinable()) g_th.join();
              g_cpu.halted = false; g_run = true;
              g_th = std::thread(runLoop);
          }

          // ---------------- A1: ELF64 yukleyici ----------------
          static inline u16 be16(const u8* p) { return (u16)((p[0] << 8) | p[1]); }
          static inline u32 be32(const u8* p) { return ((u32)p[0] << 24) | ((u32)p[1] << 16) | ((u32)p[2] << 8) | p[3]; }
          static inline u64 be64(const u8* p) { return ((u64)be32(p) << 32) | be32(p + 4); }

          static bool loadElfBytes(const u8* d, size_t n, std::string& err) {
              std::lock_guard<std::mutex> lk(g_mx);
              g_loaded = false;
              if (n >= 4 && !memcmp(d, "SCE\0", 4)) { err = "Şifreli SELF desteklenmiyor (önce düz ELF'e çözülmeli)"; return false; }
              if (n < 64 || memcmp(d, "\x7f""ELF", 4)) { err = "ELF değil"; return false; }
              if (d[4] != 2 || d[5] != 2) { err = "64-bit big-endian ELF değil"; return false; }
              if (be16(d + 18) != 21) { err = "PowerPC64 ELF değil"; return false; }
              u64 entry = be64(d + 24), phoff = be64(d + 32);
              u16 phent = be16(d + 54), phnum = be16(d + 56);
              g_mem.release();
              if (!g_mem.init()) { err = "Bellek ayrılamadı"; return false; }
              u64 minAddr = ~0ULL; int loaded = 0;
              for (u16 k = 0; k < phnum; k++) {
                  u64 po = phoff + (u64)k * phent;
                  if (po + 56 > n) break;
                  const u8* p = d + po;
                  if (be32(p) != 1) continue; // PT_LOAD
                  u64 off = be64(p + 8), va = be64(p + 16), fsz = be64(p + 32), msz = be64(p + 40);
                  if (off + fsz > n || fsz > msz || va + msz > g_mem.size) { err = "Geçersiz segment"; return false; }
                  memcpy(g_mem.base + va, d + off, fsz);
                  if (va < minAddr) minAddr = va;
                  loaded++;
                  cplog("[ELF] Segment: 0x%llX boyut=0x%llX", (ull)va, (ull)msz);
              }
              if (!loaded) { err = "Yüklenecek segment yok"; return false; }
              g_viewBase = minAddr;
              g_cpu = PPU();
              g_heap = 0x30000000ULL;
              u64 pcv = g_mem.r64(entry), toc = g_mem.r64(entry + 8);
              if (g_mem.fault) { err = "Giriş noktası okunamadı"; return false; }
              u64 top = g_mem.size > 0xD0000000ULL ? 0xD0000000ULL : g_mem.size - 0x10000;
              g_cpu.pc = pcv; g_cpu.gpr[2] = toc; g_cpu.gpr[1] = top - 0x100;
              g_cpu.halted = false;
              g_loaded = true;
              cplog("[ELF] Giriş: OPD=0x%llX PC=0x%llX TOC=0x%llX, bellek=%llu MB", (ull)entry, (ull)pcv, (ull)toc, (ull)(g_mem.size >> 20));
              return true;
          }

          // Dahili test ELF: dongu (1000 tur) + tty_write + exit(r6)
          static std::vector<u8> buildSelfTestElf() {
              std::vector<u8> f(0x410, 0);
              auto p16 = [&](size_t o, u16 v) { f[o] = v >> 8; f[o + 1] = (u8)v; };
              auto p32 = [&](size_t o, u32 v) { for (int k = 0; k < 4; k++) f[o + k] = (v >> (24 - 8 * k)) & 0xFF; };
              auto p64 = [&](size_t o, u64 v) { for (int k = 0; k < 8; k++) f[o + k] = (v >> (56 - 8 * k)) & 0xFF; };
              memcpy(f.data(), "\x7f""ELF", 4); f[4] = 2; f[5] = 2; f[6] = 1;
              p16(16, 2); p16(18, 21); p32(20, 1); p64(24, 0x10200); p64(32, 64);
              p16(52, 64); p16(54, 56); p16(56, 1); p16(58, 64);
              p32(64, 1); p32(68, 7); p64(72, 0x100); p64(80, 0x10000); p64(88, 0x10000);
              p64(96, 0x310); p64(104, 0x1000); p64(112, 0x10000);
              const u32 code[] = {
                  0x38C00000, // li r6,0
                  0x38E003E8, // li r7,1000
                  0x7CE903A6, // mtctr r7
                  0x38C60001, // loop: addi r6,r6,1
                  0x4200FFFC, // bdnz loop
                  0x39600193, // li r11,403 (sys_tty_write)
                  0x38600000, // li r3,0
                  0x3C800001, // lis r4,1
                  0x60840300, // ori r4,r4,0x300
                  0x38A00010, // li r5,16
                  0x44000002, // sc
                  0x7CC33378, // mr r3,r6
                  0x39600016, // li r11,22 (sys_process_exit)
                  0x44000002  // sc
              };
              for (size_t k = 0; k < sizeof(code) / 4; k++) p32(0x100 + k * 4, code[k]);
              p64(0x300, 0x10000); p64(0x308, 0);
              memcpy(&f[0x400], "Merhaba Cepde3!\n", 16);
              return f;
          }

          // ---------------- JNI ----------------
          extern "C" {
          JNIEXPORT jboolean JNICALL Java_com_cepde3_app_Native_loadElf(JNIEnv* e, jobject, jbyteArray arr) {
              stopRun();
              jsize n = e->GetArrayLength(arr);
              std::vector<u8> buf((size_t)n);
              e->GetByteArrayRegion(arr, 0, n, (jbyte*)buf.data());
              std::string err;
              bool ok = loadElfBytes(buf.data(), buf.size(), err);
              if (!ok) cplog("[ELF] HATA: %s", err.c_str());
              return ok;
          }
          JNIEXPORT jboolean JNICALL Java_com_cepde3_app_Native_loadSelfTest(JNIEnv*, jobject) {
              stopRun();
              std::vector<u8> elf = buildSelfTestElf();
              std::string err;
              cplog("[Cepde3] Dahili test ELF'i yükleniyor...");
              bool ok = loadElfBytes(elf.data(), elf.size(), err);
              if (!ok) cplog("[ELF] HATA: %s", err.c_str());
              return ok;
          }
          JNIEXPORT void JNICALL Java_com_cepde3_app_Native_start(JNIEnv*, jobject) { startRun(); }
          JNIEXPORT void JNICALL Java_com_cepde3_app_Native_stop(JNIEnv*, jobject) { stopRun(); }
          JNIEXPORT jboolean JNICALL Java_com_cepde3_app_Native_isRunning(JNIEnv*, jobject) { return g_run.load(); }
          JNIEXPORT void JNICALL Java_com_cepde3_app_Native_setPad(JNIEnv*, jobject, jint m) { g_pad = (u32)m; }
          JNIEXPORT jstring JNICALL Java_com_cepde3_app_Native_pollLog(JNIEnv* e, jobject) {
              std::string s;
              { std::lock_guard<std::mutex> l(g_logMx); s.swap(g_log); }
              return e->NewStringUTF(s.c_str());
          }
          JNIEXPORT jstring JNICALL Java_com_cepde3_app_Native_stats(JNIEnv* e, jobject) {
              char b[200];
              double mips = g_mipsLast;
              if (g_run) {
                  double dt = std::chrono::duration<double>(std::chrono::steady_clock::now() - g_t0).count();
                  mips = dt > 0.05 ? g_cpu.insts / dt / 1e6 : 0;
              }
              snprintf(b, sizeof b, "[%s] PC=%08llX komut=%llu MIPS=%.1f pad=%03X",
                       g_run ? "ÇALIŞIYOR" : (g_loaded ? "DURDU" : "BOŞTA"),
                       (ull)g_cpu.pc, (ull)g_cpu.insts, mips, g_pad.load());
              return e->NewStringUTF(b);
          }
          JNIEXPORT void JNICALL Java_com_cepde3_app_Native_setVideo(JNIEnv*, jobject, jboolean v) { g_video = v != 0; }
          JNIEXPORT jstring JNICALL Java_com_cepde3_app_Native_describe(JNIEnv* e, jobject, jbyteArray arr) {
              jsize n = e->GetArrayLength(arr);
              std::vector<u8> b((size_t)n + 16, 0);
              e->GetByteArrayRegion(arr, 0, n, (jbyte*)b.data());
              const char* s;
              if (n >= 4 && !memcmp(b.data(), "SCE\0", 4)) s = "Şifreli SELF/EBOOT.BIN. Cepde3 şifre çözmez; düz (şifresiz) ELF gerekir.";
              else if (n >= 4 && !memcmp(b.data(), "\x7f""PKG", 4)) s = "PKG paketi. İçindeki dosyalar şifreli olabilir; düz ELF gerekir.";
              else if (n > 0x8006 && !memcmp(&b[0x8001], "CD001", 5)) s = "ISO disk imajı. Doğrudan çalıştırılamaz; içindeki EBOOT.BIN şifreliyse düz ELF gerekir.";
              else s = "Tanınmayan biçim (ELF değil).";
              return e->NewStringUTF(s);
          }
          // A4 (ilk adim): bellek haritasi gorunumu. Her bayt 4x4 piksel, turuncu = su anki komut (PC)
          JNIEXPORT void JNICALL Java_com_cepde3_app_Native_fillFramebuffer(JNIEnv* e, jobject, jintArray arr) {
              const int W = 640, H = 360;
              jint* px = e->GetIntArrayElements(arr, nullptr);
              {
                  std::lock_guard<std::mutex> lk(g_mx);
                  if (!g_mem.base) {
                      for (int y = 0; y < H; y++) for (int x = 0; x < W; x++)
                          px[y * W + x] = (jint)(((x / 32 + y / 32) & 1) ? 0xFF14183F : 0xFF0B0E2E);
                  } else if (g_video.load()) {
                      // Video modu: PS3 yerel bellek (0xC0000000) ustunde 1280x720 A8R8G8B8 cerceve, 2x kucultulmus
                      for (int y = 0; y < H; y++) for (int x = 0; x < W; x++) {
                          u64 a = 0xC0000000ULL + ((u64)(y * 2) * 1280 + (u64)(x * 2)) * 4;
                          u32 v = 0;
                          if (a + 4 <= g_mem.size) { memcpy(&v, g_mem.base + a, 4); v = __builtin_bswap32(v); }
                          px[y * W + x] = (jint)(v | 0xFF000000u);
                      }
                  } else {
                      u64 pcv = g_cpu.pc;
                      for (int y = 0; y < H; y++) for (int x = 0; x < W; x++) {
                          u64 a = g_viewBase + (u64)((y / 4) * (W / 4) + (x / 4));
                          u32 v = a < g_mem.size ? g_mem.base[a] : 0;
                          u32 col = 0xFF000000u | ((v >> 2) << 16) | (v << 8) | (v >> 1);
                          if (a >= pcv && a < pcv + 4) col = 0xFFFFA000u;
                          px[y * W + x] = (jint)col;
                      }
                  }
              }
              e->ReleaseIntArrayElements(arr, px, 0);
          }
          } // extern "C"
          EOF

      - name: Logo ciz (Pillow) ve ikon boyutlarina yaz
        run: |
          set -e
          pip install pillow
          python3 - <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          import os

          S = 1024
          img = Image.new("RGBA", (S, S))
          px = img.load()
          for y in range(S):
              for x in range(S):
                  t = (x + y) / (2.0 * S)
                  px[x, y] = (int(10 + 70 * t), int(14 + 24 * t), int(46 + 120 * t), 255)

          # parlama halkalari (seffaf katman)
          glow = Image.new("RGBA", (S, S), (0, 0, 0, 0))
          gd = ImageDraw.Draw(glow)
          for r, a in ((470, 60), (430, 42), (390, 26)):
              gd.ellipse([S/2 - r, S/2 - r, S/2 + r, S/2 + r], outline=(120, 170, 255, a), width=6)
          img = Image.alpha_composite(img, glow)
          d = ImageDraw.Draw(img)

          # PlayStation tarzi dort sembol
          W = 26
          cy = 330
          xs = [227, 417, 607, 797]
          g, r_, b, p = (64, 214, 160), (240, 80, 90), (90, 150, 255), (240, 130, 220)
          R = 78
          # ucgen
          cx = xs[0]
          tri = [(cx, cy - R), (cx + R, cy + R * 0.8), (cx - R, cy + R * 0.8)]
          d.line(tri + [tri[0]], fill=g, width=W, joint="curve")
          # daire
          cx = xs[1]
          d.ellipse([cx - R, cy - R, cx + R, cy + R], outline=r_, width=W)
          # carpi
          cx = xs[2]
          d.line([(cx - R, cy - R), (cx + R, cy + R)], fill=b, width=W)
          d.line([(cx - R, cy + R), (cx + R, cy - R)], fill=b, width=W)
          # kare
          cx = xs[3]
          d.rectangle([cx - R, cy - R, cx + R, cy + R], outline=p, width=W)

          def font(size):
              for path in ("/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf",
                           "/usr/share/fonts/truetype/liberation/LiberationSans-Bold.ttf"):
                  if os.path.exists(path):
                      return ImageFont.truetype(path, size)
              return ImageFont.load_default(size)

          def center(text, y, f, fill, shadow=None):
              bb = d.textbbox((0, 0), text, font=f)
              w = bb[2] - bb[0]
              x = (S - w) / 2 - bb[0]
              if shadow:
                  d.text((x + 8, y + 8), text, font=f, fill=shadow)
              d.text((x, y), text, font=f, fill=fill)

          center("Cepde3", 540, font(205), (255, 255, 255, 255), (0, 0, 30, 140))
          center("PS3  \u2022  ANDROID", 810, font(66), (150, 200, 255, 255))

          # yuvarlak kose maskesi
          mask = Image.new("L", (S, S), 0)
          ImageDraw.Draw(mask).rounded_rectangle([0, 0, S - 1, S - 1], radius=220, fill=255)
          out = Image.new("RGBA", (S, S), (0, 0, 0, 0))
          out.paste(img, (0, 0), mask)

          M = "Cepde3/app/src/main/res"
          out.resize((512, 512), Image.LANCZOS).save(M + "/drawable-nodpi/logo.png")
          for name, size in (("mdpi", 48), ("hdpi", 72), ("xhdpi", 96), ("xxhdpi", 144), ("xxxhdpi", 192)):
              out.resize((size, size), Image.LANCZOS).save(M + "/mipmap-" + name + "/ic_launcher.png")
          out.save("Cepde3-logo-1024.png")
          print("Logo hazir")
          PY

      - name: Gradle wrapper ekle ve projeyi zip'le
        run: |
          set -e
          cd Cepde3
          gradle wrapper --gradle-version 8.7
          mkdir -p .github/workflows
          cp ../.github/workflows/Cepde3.yml .github/workflows/ 2>/dev/null || true
          cd ..
          zip -r Cepde3-proje.zip Cepde3 -x "*/build/*" "*/.gradle/*"

      - name: APK derle
        working-directory: Cepde3
        run: ./gradlew assembleDebug --no-daemon

      - name: Ciktilari hazirla
        run: |
          cp Cepde3/app/build/outputs/apk/debug/app-debug.apk Cepde3.apk
          ls -la Cepde3.apk Cepde3-proje.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Cepde3-APK
          path: Cepde3.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Cepde3-proje
          path: |
            Cepde3-proje.zip
            Cepde3-logo-1024.png
