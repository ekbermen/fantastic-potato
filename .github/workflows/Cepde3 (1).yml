name: Cepde3

# Tek yml: projeyi uretir, logoyu cizer, APK derler, zip'ler.
# Kullanim: bu dosyayi .github/workflows/Cepde3.yml olarak repoya koy -> Actions > Cepde3 > Run workflow
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 ndk;26.1.10909125 cmake;3.22.1'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Proje dosyalarini uret (Gradle, Manifest, Kotlin)
        run: |
          set -e
          P=Cepde3
          M=$P/app/src/main
          mkdir -p $M/java/com/cepde3/app $M/cpp $M/res/drawable-nodpi
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do mkdir -p $M/res/mipmap-$d; done

          cat > $P/settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "Cepde3"
          include ':app'
          EOF

          cat > $P/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
          }
          EOF

          cat > $P/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          android.useAndroidX=false
          android.nonTransitiveRClass=true
          EOF

          cat > $P/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.cepde3.app'
              compileSdk 34
              ndkVersion '26.1.10909125'
              defaultConfig {
                  applicationId 'com.cepde3.app'
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName '0.1-A2'
                  ndk { abiFilters 'arm64-v8a' }
                  externalNativeBuild { cmake { cppFlags '-std=c++17 -O2' } }
              }
              externalNativeBuild {
                  cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
          }
          EOF

          cat > $M/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="Cepde3"
                  android:icon="@mipmap/ic_launcher"
                  android:allowBackup="false"
                  android:largeHeap="true"
                  android:theme="@android:style/Theme.Material.NoActionBar.Fullscreen">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="sensorLandscape"
                      android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > $M/java/com/cepde3/app/MainActivity.kt <<'EOF'
          package com.cepde3.app

          import android.app.Activity
          import android.content.Intent
          import android.graphics.Bitmap
          import android.graphics.Typeface
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.view.Gravity
          import android.view.KeyEvent
          import android.view.MotionEvent
          import android.view.View
          import android.view.WindowManager
          import android.widget.Button
          import android.widget.ImageView
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView

          object Native {
              init { System.loadLibrary("cepde3") }
              external fun loadElf(data: ByteArray): Boolean
              external fun loadSelfTest(): Boolean
              external fun start()
              external fun stop()
              external fun isRunning(): Boolean
              external fun pollLog(): String
              external fun fillFramebuffer(out: IntArray)
              external fun stats(): String
              external fun setPad(mask: Int)
              external fun setVideo(on: Boolean)
              external fun describe(head: ByteArray): String
          }

          class MainActivity : Activity() {
              private val fw = 640
              private val fh = 360
              private lateinit var logView: TextView
              private lateinit var scroll: ScrollView
              private lateinit var fbView: ImageView
              private lateinit var statView: TextView
              private val bmp = Bitmap.createBitmap(fw, fh, Bitmap.Config.ARGB_8888)
              private val px = IntArray(fw * fh)
              private val ui = Handler(Looper.getMainLooper())
              private val sb = StringBuilder()
              private var showFps = true
              private var frames = 0
              private var fps = 0
              private var lastT = System.nanoTime()
              private var pad = 0
              private var video = false

              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()

              @Suppress("DEPRECATION")
              private fun hideBars() {
                  window.decorView.systemUiVisibility = (View.SYSTEM_UI_FLAG_FULLSCREEN
                      or View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                      or View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                      or View.SYSTEM_UI_FLAG_LAYOUT_STABLE)
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                  hideBars()
                  setContentView(buildUi())
                  appendLog("Cepde3 çekirdek hazır (A1 bellek+ELF64, A2 PPU yorumlayıcı).")
                  appendLog("'Dahili Test' ile çekirdeği dene veya bir PS3 ELF seç.")
                  ui.post(tick)
              }

              override fun onWindowFocusChanged(hasFocus: Boolean) {
                  super.onWindowFocusChanged(hasFocus)
                  if (hasFocus) hideBars()
              }

              private fun btn(label: String, onClick: (Button) -> Unit): Button {
                  val b = Button(this)
                  b.text = label
                  b.isAllCaps = false
                  b.textSize = 13f
                  b.setOnClickListener { onClick(b) }
                  return b
              }

              private fun buildUi(): View {
                  val root = LinearLayout(this)
                  root.orientation = LinearLayout.HORIZONTAL
                  root.setBackgroundColor(0xFF0B0E2E.toInt())
                  root.setPadding(dp(8), dp(8), dp(8), dp(8))

                  val left = LinearLayout(this)
                  left.orientation = LinearLayout.VERTICAL
                  left.gravity = Gravity.CENTER_HORIZONTAL
                  val logo = ImageView(this)
                  logo.setImageResource(R.drawable.logo)
                  left.addView(logo, LinearLayout.LayoutParams(dp(84), dp(84)))
                  val title = TextView(this)
                  title.text = "Cepde3"
                  title.textSize = 20f
                  title.setTextColor(0xFFFFFFFF.toInt())
                  title.setTypeface(null, Typeface.BOLD)
                  title.gravity = Gravity.CENTER
                  left.addView(title)
                  left.addView(btn("Oyun/ELF Seç") {
                      val it = Intent(Intent.ACTION_OPEN_DOCUMENT)
                      it.addCategory(Intent.CATEGORY_OPENABLE)
                      it.type = "*/*"
                      @Suppress("DEPRECATION")
                      startActivityForResult(it, 1)
                  })
                  left.addView(btn("Dahili Test") {
                      Thread {
                          Native.stop()
                          if (Native.loadSelfTest()) Native.start()
                      }.start()
                  })
                  left.addView(btn("Durdur") { Native.stop() })
                  left.addView(btn("Ekran: Harita") { b ->
                      video = !video
                      Native.setVideo(video)
                      b.text = if (video) "Ekran: Video" else "Ekran: Harita"
                  })
                  left.addView(btn("FPS: Açık") { b ->
                      showFps = !showFps
                      b.text = if (showFps) "FPS: Açık" else "FPS: Kapalı"
                  })
                  val leftScroll = ScrollView(this)
                  leftScroll.addView(left)
                  root.addView(leftScroll, LinearLayout.LayoutParams(dp(170), LinearLayout.LayoutParams.MATCH_PARENT))

                  val right = LinearLayout(this)
                  right.orientation = LinearLayout.VERTICAL
                  statView = TextView(this)
                  statView.setTextColor(0xFF7FD6FF.toInt())
                  statView.typeface = Typeface.MONOSPACE
                  statView.textSize = 11f
                  right.addView(statView)
                  fbView = ImageView(this)
                  fbView.scaleType = ImageView.ScaleType.FIT_CENTER
                  fbView.setImageBitmap(bmp)
                  right.addView(fbView, LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, 0, 1.4f))
                  scroll = ScrollView(this)
                  logView = TextView(this)
                  logView.setTextColor(0xFFCFE8FF.toInt())
                  logView.typeface = Typeface.MONOSPACE
                  logView.textSize = 11f
                  scroll.addView(logView)
                  right.addView(scroll, LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, 0, 1f))
                  right.addView(padRow(), LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT))
                  val lp = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.MATCH_PARENT, 1f)
                  lp.leftMargin = dp(8)
                  root.addView(right, lp)
                  return root
              }

              private fun padRow(): LinearLayout {
                  val row = LinearLayout(this)
                  row.orientation = LinearLayout.HORIZONTAL
                  val defs = listOf("◀" to 4, "▲" to 1, "▼" to 2, "▶" to 8, "✕" to 16, "○" to 32, "□" to 64, "△" to 128, "START" to 1024)
                  for ((t, m) in defs) {
                      val b = Button(this)
                      b.text = t
                      b.textSize = 12f
                      b.minWidth = 0
                      b.minimumWidth = 0
                      b.setPadding(dp(2), 0, dp(2), 0)
                      b.setOnTouchListener { _, e ->
                          when (e.actionMasked) {
                              MotionEvent.ACTION_DOWN -> { pad = pad or m; Native.setPad(pad) }
                              MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> { pad = pad and m.inv(); Native.setPad(pad) }
                          }
                          false
                      }
                      row.addView(b, LinearLayout.LayoutParams(0, dp(40), 1f))
                  }
                  return row
              }

              private fun appendLog(s: String) {
                  sb.append(s).append('\n')
                  if (sb.length > 12000) sb.delete(0, sb.length - 8000)
                  logView.text = sb
                  scroll.post { scroll.fullScroll(View.FOCUS_DOWN) }
              }

              private val tick = object : Runnable {
                  override fun run() {
                      val s = Native.pollLog()
                      if (s.isNotEmpty()) appendLog(s.trimEnd())
                      Native.fillFramebuffer(px)
                      bmp.setPixels(px, 0, fw, 0, 0, fw, fh)
                      fbView.invalidate()
                      frames++
                      val now = System.nanoTime()
                      if (now - lastT >= 1_000_000_000L) { fps = frames; frames = 0; lastT = now }
                      statView.text = (if (showFps) "FPS:" + fps + "  " else "") + Native.stats()
                      ui.postDelayed(this, 66)
                  }
              }

              @Suppress("DEPRECATION")
              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  val uri = data?.data ?: return
                  if (requestCode != 1 || resultCode != RESULT_OK) return
                  appendLog("Dosya okunuyor...")
                  Thread {
                      try {
                          Native.stop()
                          val head = ByteArray(0x9000)
                          var n = 0
                          contentResolver.openInputStream(uri)?.use { ins ->
                              while (n < head.size) { val r = ins.read(head, n, head.size - n); if (r <= 0) break; n += r }
                          }
                          if (n == 0) {
                              runOnUiThread { appendLog("Dosya açılamadı.") }
                          } else if (n >= 4 && head[0] == 0x7f.toByte() && head[1] == 'E'.code.toByte() && head[2] == 'L'.code.toByte() && head[3] == 'F'.code.toByte()) {
                              val bytes = contentResolver.openInputStream(uri)?.use { it.readBytes() }
                              if (bytes != null && Native.loadElf(bytes)) Native.start()
                          } else {
                              val d = Native.describe(head.copyOf(n))
                              runOnUiThread { appendLog("[Dosya] " + d) }
                          }
                      } catch (e: Exception) {
                          runOnUiThread { appendLog("Hata: " + e.message) }
                      }
                  }.start()
              }

              private fun padBit(k: Int): Int = when (k) {
                  KeyEvent.KEYCODE_DPAD_UP -> 1
                  KeyEvent.KEYCODE_DPAD_DOWN -> 2
                  KeyEvent.KEYCODE_DPAD_LEFT -> 4
                  KeyEvent.KEYCODE_DPAD_RIGHT -> 8
                  KeyEvent.KEYCODE_BUTTON_A -> 16
                  KeyEvent.KEYCODE_BUTTON_B -> 32
                  KeyEvent.KEYCODE_BUTTON_X -> 64
                  KeyEvent.KEYCODE_BUTTON_Y -> 128
                  KeyEvent.KEYCODE_BUTTON_L1 -> 256
                  KeyEvent.KEYCODE_BUTTON_R1 -> 512
                  KeyEvent.KEYCODE_BUTTON_START -> 1024
                  KeyEvent.KEYCODE_BUTTON_SELECT -> 2048
                  else -> 0
              }

              override fun onKeyDown(keyCode: Int, event: KeyEvent): Boolean {
                  val m = padBit(keyCode)
                  if (m != 0) { pad = pad or m; Native.setPad(pad); return true }
                  return super.onKeyDown(keyCode, event)
              }

              override fun onKeyUp(keyCode: Int, event: KeyEvent): Boolean {
                  val m = padBit(keyCode)
                  if (m != 0) { pad = pad and m.inv(); Native.setPad(pad); return true }
                  return super.onKeyUp(keyCode, event)
              }

              override fun onDestroy() {
                  ui.removeCallbacks(tick)
                  Native.stop()
                  super.onDestroy()
              }
          }
          EOF

      - name: Cekirdegi uret (C++ - A1 bellek/ELF64, A2 PPU yorumlayici)
        run: |
          set -e
          M=Cepde3/app/src/main

          cat > $M/cpp/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.22.1)
          project(cepde3)
          set(CMAKE_CXX_STANDARD 17)
          add_library(cepde3 SHARED cepde3.cpp)
          target_link_libraries(cepde3 log)
          target_link_options(cepde3 PRIVATE -Wl,-z,max-page-size=16384)
          EOF

          cat > $M/cpp/cepde3.cpp <<'EOF'
          // Cepde3 cekirdek v0.1
          // A1: big-endian bellek (4 GB sanal alan) + ELF64 yukleyici
          // A2: PPU (PowerPC 64) yorumlayici - temel tamsayi komut seti
          // A3 (kismi): LV2 syscall HLE (tty_write, process_exit, time, usleep)
          #include <jni.h>
          #include <android/log.h>
          #include <sys/mman.h>
          #include <atomic>
          #include <thread>
          #include <mutex>
          #include <string>
          #include <vector>
          #include <chrono>
          #include <cmath>
          #include <cstdint>
          #include <cstdarg>
          #include <cstdio>
          #include <cstring>

          typedef uint8_t u8;   typedef uint16_t u16;  typedef uint32_t u32;  typedef uint64_t u64;
          typedef int8_t s8;    typedef int16_t s16;   typedef int32_t s32;   typedef int64_t s64;
          typedef unsigned long long ull;

          // ---------------- Log ----------------
          static std::mutex g_logMx;
          static std::string g_log;
          static void cplog(const char* fmt, ...) {
              char b[600];
              va_list a; va_start(a, fmt); vsnprintf(b, sizeof b, fmt, a); va_end(a);
              std::lock_guard<std::mutex> l(g_logMx);
              g_log += b; g_log += '\n';
              __android_log_print(ANDROID_LOG_INFO, "Cepde3", "%s", b);
          }

          // ---------------- A1: Bellek ----------------
          struct Mem {
              u8* base = nullptr; u64 size = 0; bool fault = false; u64 faultAddr = 0;
              bool init() {
                  if (base) return true;
                  const u64 tries[] = {0x100000000ULL, 0x40000000ULL, 0x10000000ULL};
                  for (u64 s : tries) {
                      void* p = mmap(nullptr, s, PROT_READ | PROT_WRITE, MAP_PRIVATE | MAP_ANONYMOUS | MAP_NORESERVE, -1, 0);
                      if (p != MAP_FAILED) { base = (u8*)p; size = s; fault = false; return true; }
                  }
                  return false;
              }
              void release() { if (base) { munmap(base, size); base = nullptr; size = 0; } }
              bool chk(u64 a, u64 n) {
                  if (a > size || n > size - a) { fault = true; faultAddr = a; return false; }
                  return true;
              }
              u8  r8(u64 a)  { return chk(a, 1) ? base[a] : 0; }
              u16 r16(u64 a) { if (!chk(a, 2)) return 0; u16 v; memcpy(&v, base + a, 2); return __builtin_bswap16(v); }
              u32 r32(u64 a) { if (!chk(a, 4)) return 0; u32 v; memcpy(&v, base + a, 4); return __builtin_bswap32(v); }
              u64 r64(u64 a) { if (!chk(a, 8)) return 0; u64 v; memcpy(&v, base + a, 8); return __builtin_bswap64(v); }
              void w8(u64 a, u8 v)   { if (chk(a, 1)) base[a] = v; }
              void w16(u64 a, u16 v) { if (chk(a, 2)) { v = __builtin_bswap16(v); memcpy(base + a, &v, 2); } }
              void w32(u64 a, u32 v) { if (chk(a, 4)) { v = __builtin_bswap32(v); memcpy(base + a, &v, 4); } }
              void w64(u64 a, u64 v) { if (chk(a, 8)) { v = __builtin_bswap64(v); memcpy(base + a, &v, 8); } }
          };

          struct PPU {
              u64 gpr[32] = {};
              u64 pc = 0, lr = 0, ctr = 0, xer = 0, insts = 0;
                  double f[32] = {};
                  u32 ca = 0;
                  u32 cr = 0;
              bool halted = true;
              int exitCode = 0;
          };

          static Mem g_mem;
          static PPU g_cpu;
          static std::mutex g_mx;
          static std::thread g_th;
          static std::atomic<bool> g_run{false};
          static bool g_loaded = false;
          static u64 g_viewBase = 0x10000;
          static std::atomic<u32> g_pad{0};
          static std::atomic<bool> g_video{false};
          static u64 g_heap = 0x30000000ULL;
          static double g_mipsLast = 0;
          static std::chrono::steady_clock::time_point g_t0 = std::chrono::steady_clock::now();

          // ---------------- A3: LV2 syscall HLE ----------------
          static void lv2(PPU& c, Mem& m) {
              u64 n = c.gpr[11];
              switch (n) {
                  case 22:   // sys_process_exit
                  case 41:   // sys_ppu_thread_exit
                      c.halted = true; c.exitCode = (int)c.gpr[3];
                      cplog("[LV2] exit(%d)", c.exitCode);
                      break;
                  case 403: { // sys_tty_write(ch, buf, len, *written)
                      u64 buf = c.gpr[4]; u32 len = (u32)c.gpr[5];
                      if (len > 2048) len = 2048;
                      std::string s;
                      for (u32 k = 0; k < len; k++) {
                          u8 ch = m.r8(buf + k);
                          if (ch >= 0x20 && ch < 0x7F) s += (char)ch; else if (ch == '\n' || ch == '\t') s += ' ';
                      }
                      cplog("[TTY] %s", s.c_str());
                      if (c.gpr[6]) m.w32(c.gpr[6], len);
                      c.gpr[3] = 0;
                      break;
                  }
                  case 145: { // sys_time_get_system_time (us)
                      auto d = std::chrono::steady_clock::now().time_since_epoch();
                      c.gpr[3] = (u64)std::chrono::duration_cast<std::chrono::microseconds>(d).count();
                      break;
                  }
                  case 141: { // sys_timer_usleep
                      u64 us = c.gpr[3]; if (us > 1000000) us = 1000000;
                      std::this_thread::sleep_for(std::chrono::microseconds(us));
                      c.gpr[3] = 0;
                      break;
                  }
                  case 348: { // sys_memory_allocate(size, flags, *addr)
                      u64 sz = (c.gpr[3] + 0xFFFFF) & ~0xFFFFFULL;
                      if (g_heap + sz > m.size) { c.gpr[3] = 0x80010004; break; }
                      m.w32(c.gpr[5], (u32)g_heap); g_heap += sz; c.gpr[3] = 0;
                      break; }
                  case 349: c.gpr[3] = 0; break;  // sys_memory_free
                  case 48:  m.w64(c.gpr[3], 1); c.gpr[3] = 0; break; // sys_ppu_thread_get_id
                  case 43: case 142:  c.gpr[3] = 0; break; // yield / timer_sleep
                  case 95: case 96: case 97: case 98: case 99:        // lwmutex (tek is parcacigi)
                  case 100: case 101: case 102: case 103: case 104:   // mutex
                      c.gpr[3] = 0; break;
                  default:
                      cplog("[LV2] HLE yok: syscall %llu -> 0 donuyor", (ull)n);
                      c.gpr[3] = 0;
                      break;
              }
          }

          // ---------------- A2: PPU yorumlayici ----------------
          static inline u64 rotl64(u64 v, int n) { n &= 63; return n ? (v << n) | (v >> (64 - n)) : v; }
          static inline u32 rotl32(u32 v, int n) { n &= 31; return n ? (v << n) | (v >> (32 - n)) : v; }
          static u64 mask64(int mb, int me) {
              u64 a = ~0ULL >> mb, b = ~0ULL << (63 - me);
              return mb <= me ? (a & b) : (a | b);
          }

          static void step(PPU& c, Mem& m) {
              const u64 pc = c.pc;
              const u32 i = m.r32(pc);
              if (m.fault) { c.halted = true; return; }
              u64 npc = pc + 4;
              c.insts++;
              const u32 op = i >> 26;
              const int rt = (i >> 21) & 31, ra = (i >> 16) & 31, rb = (i >> 11) & 31;
              const s64 simm = (s16)(i & 0xFFFF);
              const u64 uimm = i & 0xFFFF;
              u64* R = c.gpr;
              bool bad = false;

              auto ra0 = [&]() -> u64 { return ra ? R[ra] : 0; };
              auto crf = [&](int f, bool lt, bool gt) {
                  u32 nib = (lt ? 8 : gt ? 4 : 2) | (u32)((c.xer >> 31) & 1);
                  int sh = (7 - f) * 4;
                  c.cr = (c.cr & ~(0xFu << sh)) | (nib << sh);
              };
              auto rc = [&](u64 v) { if (i & 1) { s64 s = (s64)v; crf(0, s < 0, s > 0); } };
              auto cmps = [&](int f, s64 a, s64 b) { crf(f, a < b, a > b); };
              auto cmpu = [&](int f, u64 a, u64 b) { crf(f, a < b, a > b); };
              auto condOk = [&](int bo, int bi) -> bool {
                  bool ctrOk = true;
                  if (!(bo & 4)) { c.ctr--; ctrOk = ((c.ctr != 0) != (bool)((bo >> 1) & 1)); }
                  bool cOk = (bo & 16) || (((c.cr >> (31 - bi)) & 1) == (u32)((bo >> 3) & 1));
                  return ctrOk && cOk;
              };

              double* F = c.f;
              auto bits2d = [](u64 b) { double d; memcpy(&d, &b, 8); return d; };
              auto d2bits = [](double d) { u64 b; memcpy(&b, &d, 8); return b; };
              auto s2d = [](u32 b) { float f; memcpy(&f, &b, 4); return (double)f; };
              auto d2s = [](double d) { float f = (float)d; u32 b; memcpy(&b, &f, 4); return b; };
              auto f2i32 = [](double v) -> s32 { if (std::isnan(v)) return INT32_MIN; if (v >= 2147483647.0) return INT32_MAX; if (v <= -2147483648.0) return INT32_MIN; return (s32)v; };
