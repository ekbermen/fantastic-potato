      - name: Gradle ayarlarını yamala (AAR metadata hatası düzeltmesi)
        run: |
          grep -q "android.useAndroidX" gradle.properties || echo "android.useAndroidX=true" >> gradle.properties
          sed -i "s/compileSdk 34/compileSdk 35/" app/build.gradle
          sed -i "s/version '8.5.2'/version '8.7.3'/" build.gradle
          # zorla sabitlenmiş eski androidx.core sürümünü kaldır
          python3 - <<'PY'
          import re
          p = "app/build.gradle"
          t = open(p, encoding="utf-8").read()
          t = re.sub(r"configurations\.all\s*\{.*?\n\}\s*", "", t, flags=re.S)
          open(p, "w", encoding="utf-8").write(t)
          PY
          grep -n "compileSdk\|version '" app/build.gradle build.gradle
          cat gradle.properties
          tail -n 8 app/build.gradle

      - name: local.properties
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "sdk.dir=$SDK_DIR" > local.properties
          echo "GEMINI_API_KEY=${GEMINI_API_KEY}" >> local.properties

      - name: Derle (debug APK)
        run: |
          set +e
          gradle assembleDebug --console=plain --no-daemon 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            echo ""
            echo "=================== HATA ÖZETİ ==================="
            grep -nE -A 14 "What went wrong" build.log | head -60
            grep -nE "^e: |error:|Unresolved" build.log | head -60
            echo "=================================================="
            exit "$code"
          fi

      - name: Hata logunu yükle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: APK yükle
        uses: actions/upload-artifact@v4
        with:
          name: Novax-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
